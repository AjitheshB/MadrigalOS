<!DOCTYPE html>

<html>
  <head>
    <title>MadrigalOS</title>
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>


    <!-- Intro and welcome screen-->
     <div class="intro">
      <h1>MadrigalOS</h1>
      <p class="enter">Click to enter</p>
     </div>

    <!--Desktop text-->
    <div class="welcome-text">
      <h1>MadrigalOS</h1>
      <p>Productivity peaking time?</p>
    </div>

    <!--Bottom dock-->
    <div class="dock">
      <div class="dock-item">
        <i data-lucide="square-terminal"></i>
      </div>
      
      <div class="dock-item tasks">
        <i data-lucide="list-checks"></i>
      </div>
      
      <div class="dock-item">
        <i data-lucide="calendar-days"></i>
      </div>

      <div class="dock-item">
        <i data-lucide="folder"></i>
      </div>

      <div class="dock-item">
        <i data-lucide="settings"></i>
      </div>
    </div>

    <!--Tasks app-->
    <div class="app tasks">
      <div class="app-head">
        <h1>Tasks</h1>
        <i data-lucide="x" class="close"></i>
      </div>

      <div class="task-list">
        <!--tasks-->
      </div>

      <button class="addtask">+ Add Task</button>
      <button class="cleartasks" type="button">
        <i data-lucide="brush-cleaning" class="cleartasks"></i>
      </button>

      <div class="addtask-model">
        <div class="addtask-modelcard">
          <h2>New Task</h2>
          
          <input type="text" placeholder="What do you want to do?" class="task-input">

          <div class="addtask-modelactions">
            <div class="taskapp-buttons">
              <button class="task-cancel" type="button">
                <i data-lucide="undo-2"></i>
              </button>
              <button class="task-save" type="button">
                <i data-lucide="check-check"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>


    <!--App icon library!-->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!--Javascript-->
    <script src="script.js"></script>

  </body>
</html>
